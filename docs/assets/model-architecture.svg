<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Moondream-mini model architecture</title>
  <desc id="desc">A visual diagram showing an input image and question flowing through a mini vision encoder, visual tokens, token fusion, lightweight decoder, and constrained answer output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="imageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#475569}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#64748b}
      .white{fill:#fff}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}
      .chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1180" height="520" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="label" font-size="26">Moondream-mini: compact image-conditioned answer generation</text>
  <text x="48" y="82" class="small">A tiny VLM path for PPE QA: visual tokens are prepended to question tokens, then decoded into short constrained labels.</text>

  <g transform="translate(48 125)">
    <rect class="box" width="170" height="250" rx="22"/>
    <rect x="24" y="26" width="122" height="90" rx="16" fill="url(#imageGrad)"/>
    <circle cx="62" cy="58" r="14" fill="#fde68a"/>
    <path d="M25 116 L70 75 L100 100 L124 72 L146 116 Z" fill="#ecfeff" opacity="0.9"/>
    <rect x="42" y="144" width="86" height="72" rx="16" fill="#e2e8f0"/>
    <path d="M58 194 L72 166 L86 194 Z" fill="#facc15"/>
    <rect x="94" y="166" width="16" height="38" rx="4" fill="#fb7185"/>
    <text x="85" y="236" text-anchor="middle" class="label">Image</text>
  </g>

  <path class="arrow" d="M235 250 H310"/>

  <g transform="translate(330 125)">
    <rect class="box" width="210" height="250" rx="22"/>
    <text x="105" y="42" text-anchor="middle" class="label">Vision Encoder</text>
    <text x="105" y="68" text-anchor="middle" class="small">patches + CLS token</text>
    <g transform="translate(38 96)">
      <rect class="chip" width="36" height="36" rx="8"/>
      <rect class="chip" x="46" width="36" height="36" rx="8"/>
      <rect class="chip" x="92" width="36" height="36" rx="8"/>
      <rect class="chip" y="46" width="36" height="36" rx="8"/>
      <rect class="chip" x="46" y="46" width="36" height="36" rx="8"/>
      <rect class="chip" x="92" y="46" width="36" height="36" rx="8"/>
    </g>
    <rect x="38" y="202" width="134" height="30" rx="15" fill="#ede9fe"/>
    <text x="105" y="222" text-anchor="middle" class="tiny">compact Transformer blocks</text>
  </g>

  <path class="arrow" d="M555 250 H620"/>

  <g transform="translate(640 125)">
    <rect class="box" width="180" height="250" rx="22"/>
    <text x="90" y="42" text-anchor="middle" class="label">Visual Tokens</text>
    <text x="90" y="68" text-anchor="middle" class="small">projected to text width</text>
    <g transform="translate(32 104)">
      <rect x="0" y="0" width="28" height="92" rx="10" fill="#818cf8"/>
      <rect x="38" y="0" width="28" height="92" rx="10" fill="#60a5fa"/>
      <rect x="76" y="0" width="28" height="92" rx="10" fill="#2dd4bf"/>
      <rect x="114" y="0" width="28" height="92" rx="10" fill="#34d399"/>
    </g>
    <text x="90" y="232" text-anchor="middle" class="tiny">image prefix sequence</text>
  </g>

  <g transform="translate(48 410)">
    <rect width="355" height="62" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="22" y="26" class="label" font-size="16">Question</text>
    <text x="22" y="48" class="small">How many workers wear safety helmets?</text>
  </g>

  <path class="arrow" d="M415 440 H620"/>

  <g transform="translate(640 410)">
    <rect width="180" height="62" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" class="label" font-size="16">Text Tokens</text>
    <text x="90" y="48" text-anchor="middle" class="small">token embeddings</text>
  </g>

  <path class="arrow" d="M835 250 H900"/>
  <path class="arrow" d="M835 440 C875 440 870 350 900 325"/>

  <g transform="translate(920 135)">
    <rect width="210" height="240" rx="24" fill="url(#modelGrad)" filter="url(#shadow)"/>
    <text x="105" y="42" text-anchor="middle" class="white label">Fusion + Decoder</text>
    <text x="105" y="70" text-anchor="middle" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="14">prepend image tokens</text>
    <rect x="34" y="102" width="142" height="42" rx="14" fill="#ffffff" opacity="0.18"/>
    <text x="105" y="129" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14">causal Transformer</text>
    <rect x="34" y="158" width="142" height="42" rx="14" fill="#ffffff" opacity="0.18"/>
    <text x="105" y="185" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14">LM head</text>
  </g>

  <path class="arrow" d="M1025 390 V430"/>
  <g transform="translate(905 432)">
    <rect width="240" height="56" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="120" y="24" text-anchor="middle" class="label" font-size="16">Constrained answer</text>
    <text x="120" y="45" text-anchor="middle" class="small">yes/no · 0/1/2/3+ · left/center/right</text>
  </g>
</svg>
