model:
  image_size: 224
  patch_size: 16
  vision_dim: 128
  text_dim: 128
  num_heads: 4
  num_vision_layers: 2
  num_text_layers: 3
  ff_dim: 384
  max_text_len: 128
  dropout: 0.1

training:
  epochs: 20
  batch_size: 16
  grad_accumulation_steps: 1
  lr: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
